name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os != 'Windows'
        run: npm ci
      - if: runner.os == 'Windows'
        run: cmd /c setup.cmd
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
